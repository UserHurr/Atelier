<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carnet d'Entraînement — Pink Fitness</title>
  <style>
    :root {
      --bg: #fff5f7;
      --card: #ffffff;
      --card-accent: #fce7f3;
      --primary: #db2777;
      --primary-hover: #be185d;
      --secondary: #f472b6;
      --danger: #ef4444;
      --text: #1f2937;
      --text-sub: #6b7280;
      --border: #fbcfe8;
      --shadow: 0 4px 15px rgba(219, 39, 119, 0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 14px;
      padding-bottom: 40px;
    }
    h1 {
      color: var(--primary);
      text-align: center;
      font-size: 1.5rem;
      margin: 5px 0 15px 0;
      font-weight: 800;
    }
    h2 {
      color: var(--primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 6px;
      font-size: 1.15rem;
      margin-top: 0;
    }
    
    .tabs { display: flex; gap: 6px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 12px 6px; background: var(--card); color: var(--text-sub);
      border: 1px solid var(--border); border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 0.85rem;
      box-shadow: var(--shadow); transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary); color: #ffffff; border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(219, 39, 119, 0.3);
    }
    
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--card); padding: 16px; border-radius: 14px;
      margin-bottom: 15px; border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .badge {
      display: inline-block; background: #fce7f3; color: var(--primary);
      padding: 3px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: bold;
    }
    
    label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-top: 10px; font-weight: 600; }
    input, select, textarea, button {
      width: 100%; padding: 11px; margin-top: 5px; border-radius: 10px;
      border: 1px solid var(--border); background: #fff5f7; color: var(--text);
      box-sizing: border-box; font-size: 0.95rem; outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      background: #ffffff;
    }
    button.btn-main {
      background: var(--primary); color: #ffffff; font-weight: bold;
      border: none; margin-top: 15px; cursor: pointer; padding: 13px; font-size: 1rem;
      border-radius: 10px; box-shadow: 0 4px 12px rgba(219, 39, 119, 0.25);
    }
    button.btn-main:active { background: var(--primary-hover); }

    .reco-box {
      background: #fdf2f8; border: 1.5px solid var(--secondary);
      padding: 12px; border-radius: 10px; margin-top: 12px; font-weight: bold; font-size: 0.9rem;
      color: #9d174d;
    }
    .reco-box span { color: var(--primary); font-size: 1.1rem; }

    .warmup-box {
      background: #fce7f3; border-left: 4px solid var(--primary);
      padding: 12px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 14px;
      line-height: 1.5; color: #831843;
    }

    .finisher-box {
      background: #f0fdf4; border-left: 4px solid #22c55e;
      padding: 12px; border-radius: 8px; font-size: 0.88rem; margin-top: 14px;
      line-height: 1.5; color: #15803d; font-weight: 600;
    }

    .btn-del {
      background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; padding: 4px 8px;
      border-radius: 6px; cursor: pointer; font-size: 0.75rem; width: auto; font-weight: bold;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 10px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--primary); background: #fdf2f8; font-weight: bold; }
    tr:nth-child(even) { background-color: #fff9fa; }
  </style>
</head>
<body>

  <h1>🌸 Pink Fitness Tracker</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(event, 'workout')">🏋️‍♀️ Saisir Perf</button>
    <button class="tab-btn" onclick="switchTab(event, 'program')">📖 Programme</button>
    <button class="tab-btn" onclick="switchTab(event, 'history')">📊 Historique</button>
  </div>

  <!-- TAB 1 : LOG SÉANCE & AUTO-PROGRESSION -->
  <div id="workout" class="tab-content active">
    <div class="card">
      <h2>1. Sélectionner la Séance 🧘‍♀️</h2>
      <label for="selectDay">Séance du jour</label>
      <select id="selectDay" onchange="updateWorkoutForm()">
        <option value="S1">Séance 1 : Bas du Corps (Fentes, Presse, Quadri, Mollets)</option>
        <option value="S2">Séance 2 : Haut du Corps (Tirages, Épaules, Pompes)</option>
        <option value="S3">Séance 3 : Bas du Corps (Step up, SDT, Ischio, Mollets, Lombaires)</option>
      </select>
    </div>

    <div id="warmupDisplay" class="warmup-box"></div>

    <div class="card">
      <h2>2. Saisir la Performance 🏋️‍♀️</h2>
      <form id="logForm">
        <label for="date">📅 Date</label>
        <input type="date" id="date" required>

        <label for="selectExo">💪 Exercice à enregistrer</label>
        <select id="selectExo" onchange="calculateRecommendation()"></select>

        <div id="exoDetails" style="font-size: 0.85rem; color: var(--text-sub); margin-top: 6px;"></div>

        <div id="recoDisplay" class="reco-box">
          💡 Charge recommandée prochaine fois : <span>Sélectionnez un exercice</span>
        </div>

        <div style="display:flex; gap:8px; margin-top: 8px;">
          <div style="flex:1;">
            <label for="poids">🏋️‍♀️ Charge (kg)</label>
            <input type="number" id="poids" step="0.5" placeholder="ex: 35" required>
          </div>
          <div style="flex:1;">
            <label for="reps">🔢 Reps faites</label>
            <input type="number" id="reps" placeholder="ex: 10" required>
          </div>
          <div style="flex:1;">
            <label for="rpe">🔥 RPE (1-10)</label>
            <input type="number" id="rpe" min="1" max="10" step="0.5" placeholder="ex: 8" required>
          </div>
        </div>

        <label for="notes">✨ Notes / Sensations</label>
        <textarea id="notes" rows="2" placeholder="ex: Bonne amplitude, charge fluide..."></textarea>

        <button type="submit" class="btn-main">💖 Enregistrer la Série</button>
      </form>
    </div>

    <div id="finisherDisplay" class="finisher-box"></div>
  </div>

  <!-- TAB 2 : VISUALISATION COMPLÈTE DU PROGRAMME -->
  <div id="program" class="tab-content">
    <div id="programDetailsContainer"></div>
  </div>

  <!-- TAB 3 : HISTORIQUE ET DONNÉES -->
  <div id="history" class="tab-content">
    <div class="card">
      <h2>📊 Historique & Données</h2>
      
      <label for="searchExo">🔍 Filtrer par exercice :</label>
      <input type="text" id="searchExo" placeholder="ex: Fentes, Tirage, SDT..." oninput="renderHistory()">

      <div style="display:flex; gap:6px; margin-top:12px;">
        <button onclick="exportCSV()" style="background:#fce7f3; color:var(--primary); font-size:0.8rem; margin:0; border:1px solid var(--border); font-weight:bold;">Exporter CSV</button>
        <button onclick="exportJSON()" style="background:#fce7f3; color:#9d174d; font-size:0.8rem; margin:0; border:1px solid var(--border); font-weight:bold;">Sauvegarder</button>
        <button onclick="document.getElementById('importFile').click()" style="background:#fff5f7; color:var(--text); font-size:0.8rem; margin:0; border:1px solid var(--border);">Importer</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importJSON(event)">
      </div>

      <div style="overflow-x:auto; margin-top:10px;">
        <table id="historyTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>Exo</th>
              <th>Kg</th>
              <th>Reps</th>
              <th>RPE</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const PROGRAM_DATA = {
      S1: {
        title: "Séance 1 : Bas du Corps (Quads / Fessiers / Mollets)",
        warmup: "<b>🔥 Échauffement Bas du Corps :</b><br>• Circuit (2 à 3 tours) : Squat goblet (respirer en squat profond), Corde à sauter (30 sec), Gainage (30 sec), Mobilisation hanches.<br>• <b>Montée en gamme :</b> 1 à 2 séries légères d'échauffement sur le premier exercice avant de charger.",
        finisher: "<b>🧘‍♀️ Bonus fin de séance :</b> Suivre vidéo abdos.",
        exos: [
          { name: "Fentes bulgares", target: "3 x 8-10 reps/jambe", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Presse à cuisses", target: "3 x 10-12 reps", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Machine quadri (Leg Extension)", target: "3 x 12-15 reps", rpe: "RPE 8.5", rest: "1 min 30" },
          { name: "Extension mollet", target: "3 x 12-15 reps", rpe: "RPE 8.5", rest: "1 min 30" }
        ]
      },
      S2: {
        title: "Séance 2 : Haut du Corps (Dos / Épaules / Pectoraux)",
        warmup: "<b>🔥 Échauffement Haut du Corps :</b><br>• Circuit (2 à 3 tours) : Mobilisation épaules à l'élastique, Pompes scapulaires, Mobilisation épaules avec petits haltères.<br>• <b>Montée en gamme :</b> 1 à 2 séries légères d'échauffement avant les séries effectives.",
        finisher: "<b>🏃‍♀️ Finisher Cardio :</b> Cardio 20 min minimum.",
        exos: [
          { name: "Tirage vertical", target: "3 x 8-10 reps", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Tirage horizontal", target: "3 x 10-12 reps", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Développé militaire debout", target: "3 x 8-10 reps", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Pompes + Exo élastique", target: "3 x 10-12 reps", rpe: "RPE 8.5", rest: "1 min 30" }
        ]
      },
      S3: {
        title: "Séance 3 : Bas du Corps (Chaîne Postérieure & Unipodal)",
        warmup: "<b>🔥 Échauffement Bas du Corps :</b><br>• Circuit (2 à 3 tours) : Squat goblet (respirer en squat profond), Corde à sauter (30 sec), Gainage (30 sec), Mobilisation hanches.<br>• <b>Montée en gamme :</b> 1 à 2 séries légères d'échauffement (notamment sur le SDT).",
        finisher: "<b>🧘‍♀️ Bonus fin de séance :</b> Suivre vidéo abdos.",
        exos: [
          { name: "Step up", target: "3 x 8-10 reps/jambe", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Soulevé de terre (SDT)", target: "3 x 8-10 reps", rpe: "RPE 8", rest: "2 min 30" },
          { name: "Machine ischio (Leg Curl)", target: "3 x 10-12 reps", rpe: "RPE 8.5", rest: "1 min 30" },
          { name: "Extension mollet", target: "3 x 12-15 reps", rpe: "RPE 8.5", rest: "1 min 30" },
          { name: "Extension lombaire", target: "3 x 10-12 reps", rpe: "RPE 8", rest: "1 min 30" }
        ]
      }
    };

    document.getElementById('date').valueAsDate = new Date();

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      
      if(evt && evt.currentTarget) {
        evt.currentTarget.classList.add('active');
      }
      
      const targetContent = document.getElementById(tabId);
      if(targetContent) {
        targetContent.classList.add('active');
      }

      if (tabId === 'history') renderHistory();
      if (tabId === 'program') renderProgramView();
    }

    function renderProgramView() {
      const container = document.getElementById('programDetailsContainer');
      let html = '';

      ['S1', 'S2', 'S3'].forEach(sKey => {
        const sData = PROGRAM_DATA[sKey];
        html += `
          <div class="card">
            <h2>${sData.title}</h2>
            <div class="warmup-box" style="margin-top:10px;">${sData.warmup}</div>
            <table>
              <thead>
                <tr>
                  <th>Exercice</th>
                  <th>Format</th>
                  <th>Cible</th>
                  <th>Repos</th>
                </tr>
              </thead>
              <tbody>`;
        
        sData.exos.forEach(exo => {
          html += `
            <tr>
              <td><b>${exo.name}</b></td>
              <td>${exo.target}</td>
              <td><span class="badge">${exo.rpe}</span></td>
              <td><span class="badge" style="background:#e0f2fe; color:#0369a1;">${exo.rest}</span></td>
            </tr>`;
        });

        html += `
              </tbody>
            </table>
            <div class="finisher-box">${sData.finisher}</div>
          </div>`;
      });

      container.innerHTML = html;
    }

    function updateWorkoutForm() {
      const dayKey = document.getElementById('selectDay').value;
      const dayData = PROGRAM_DATA[dayKey];

      document.getElementById('warmupDisplay').innerHTML = dayData.warmup;
      document.getElementById('finisherDisplay').innerHTML = dayData.finisher;

      const exoSelect = document.getElementById('selectExo');
      exoSelect.innerHTML = '';
      
      dayData.exos.forEach((exo) => {
        const opt = document.createElement('option');
        opt.value = exo.name;
        opt.textContent = exo.name;
        opt.dataset.target = exo.target;
        opt.dataset.rpe = exo.rpe;
        opt.dataset.rest = exo.rest;
        exoSelect.appendChild(opt);
      });

      calculateRecommendation();
    }

    function calculateRecommendation() {
      const exoSelect = document.getElementById('selectExo');
      const selectedOpt = exoSelect.options[exoSelect.selectedIndex];
      if (!selectedOpt) return;

      const exoName = selectedOpt.value;
      document.getElementById('exoDetails').innerHTML = 
        `<b>Cible :</b> ${selectedOpt.dataset.target} | <b>Intensité :</b> ${selectedOpt.dataset.rpe} | <b>Repos :</b> ${selectedOpt.dataset.rest}`;

      const logs = JSON.parse(localStorage.getItem('pink_fitness_logs') || '[]');
      const lastLog = logs.slice().reverse().find(l => l.exo === exoName);

      const recoBox = document.getElementById('recoDisplay');
      if (!lastLog || !lastLog.poids) {
        recoBox.innerHTML = `💡 Charge recommandée : <span>Déterminer charge initiale (${selectedOpt.dataset.rpe})</span>`;
        return;
      }

      const lastW = parseFloat(lastLog.poids);
      const lastRpe = parseFloat(lastLog.rpe);

      let isIsolation = exoName.toLowerCase().includes("mollet") || 
                        exoName.toLowerCase().includes("lombaire") || 
                        exoName.toLowerCase().includes("élastique");
      let step = isIsolation ? 1.0 : 2.5;
      let nextW = lastW;
      let reason = "";

      if (lastRpe <= 7.5) {
        nextW += step * 1.5;
        reason = `Série facile (RPE ${lastRpe}) ↗️ +${step * 1.5} kg`;
      } else if (lastRpe <= 8.5) {
        nextW += step;
        reason = `Objectif atteint (RPE ${lastRpe}) ↗️ +${step} kg`;
      } else if (lastRpe <= 9.5) {
        reason = `Effort intense (RPE ${lastRpe}) ➡️ Garder la même charge (${lastW} kg)`;
      } else {
        nextW = Math.max(0, lastW - step);
        reason = `Limite atteinte (RPE ${lastRpe}) ↘️ Réduire légèrement (${nextW} kg)`;
      }

      recoBox.innerHTML = `💡 Charge recommandée prochaine fois : <span>${nextW.toFixed(1)} kg</span> <br><small style="color:var(--text-sub); font-weight:normal;">(${reason})</small>`;
    }

    document.getElementById('logForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const logs = JSON.parse(localStorage.getItem('pink_fitness_logs') || '[]');
      
      const newEntry = {
        date: document.getElementById('date').value,
        day: document.getElementById('selectDay').value,
        exo: document.getElementById('selectExo').value,
        poids: document.getElementById('poids').value,
        reps: document.getElementById('reps').value,
        rpe: document.getElementById('rpe').value,
        notes: document.getElementById('notes').value
      };

      logs.push(newEntry);
      localStorage.setItem('pink_fitness_logs', JSON.stringify(logs));

      alert('💖 Série enregistrée avec succès !');
      document.getElementById('notes').value = '';
      calculateRecommendation();
    });

    function renderHistory() {
      const logs = JSON.parse(localStorage.getItem('pink_fitness_logs') || '[]');
      const filter = document.getElementById('searchExo') ? document.getElementById('searchExo').value.toLowerCase() : '';
      const tbody = document.querySelector('#historyTable tbody');
      tbody.innerHTML = '';
      
      logs.map((log, index) => ({ ...log, originalIndex: index }))
          .filter(l => l.exo.toLowerCase().includes(filter))
          .reverse()
          .forEach(l => {
            const row = `<tr>
              <td>${l.date.slice(5)}</td>
              <td><b>${l.exo}</b></td>
              <td>${l.poids} kg</td>
              <td>${l.reps}</td>
              <td>${l.rpe}</td>
              <td><button class="btn-del" onclick="deleteLog(${l.originalIndex})">🗑️</button></td>
            </tr>`;
            tbody.innerHTML += row;
          });
    }

    function deleteLog(index) {
      if (confirm("Supprimer cette performance ?")) {
        let logs = JSON.parse(localStorage.getItem('pink_fitness_logs') || '[]');
        logs.splice(index, 1);
        localStorage.setItem('pink_fitness_logs', JSON.stringify(logs));
        renderHistory();
        calculateRecommendation();
      }
    }

    function exportJSON() {
      const logs = localStorage.getItem('pink_fitness_logs') || '[]';
      const blob = new Blob([logs], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `backup_pink_fitness_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (Array.isArray(data)) {
            localStorage.setItem('pink_fitness_logs', JSON.stringify(data));
            alert('✅ Sauvegarde restaurée !');
            renderHistory();
            calculateRecommendation();
          } else {
            alert('❌ Fichier JSON invalide.');
          }
        } catch (err) {
          alert('❌ Erreur de lecture.');
        }
      };
      reader.readAsText(file);
    }

    function exportCSV() {
      const logs = JSON.parse(localStorage.getItem('pink_fitness_logs') || '[]');
      if (logs.length === 0) return alert('Aucune donnée à exporter.');
      
      let csv = 'Date,Seance,Exercice,Poids,Reps,RPE,Notes\n';
      logs.forEach(l => {
        csv += `"${l.date}","${l.day}","${l.exo}","${l.poids}","${l.reps}","${l.rpe}","${l.notes}"\n`;
      });
      
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pink_fitness_logs_${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
    }

    // Initialisation
    updateWorkoutForm();
    renderProgramView();
  </script>
</body>
</html>
